<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
        }
      }
    </script>
    
    <script type="module" src="./axesHelper.js"></script>
  </head>

  <body id="body">
    <div id="main-display"></div>

    <style>
      * {
        overflow: hidden;    /* 中のスクロールを非表示 */
        margin: unset;
        padding: unset;
      }

      html, body, #main-display {
        width: 100%;
        height: 100%;
      }

      #main-canvas {
        width: 100%;
        height: 100%;
      }

      #main-display::-webkit-scrollbar{
        display: none;
      }
    </style>
  </body>
</html>
