<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>sample</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
        }
      }
    </script>

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      console.log(window.dataLayer)
      gtag('js', new Date());
      gtag('config', 'G-Y3XZ7NZFCZ');
    </script>
    
    <script type="module" src="./cubeTouch.js"></script>
    <link rel="stylesheet" href="./style.css">

  </head>

  <body oncontextmenu="return false;" >
    <div id="grids" data-state="EXPLORE">
      <div id="main-display">
      </div>

      <div class="sulves-map">
        <div class="step-meter">
        </div>
        <div class="sulves-buttons">
          <div class="btn-div back-div">
            <img class="back-btn" src="./img/back-step.png">
          </div>

          <div class="btn-div reverse-div" style="display: none;">
            <img class="reverse-btn" src="./img/reverse-play.png">
          </div>

          <div class="btn-div stop-div" style="display: none;">
            <img class="stop-btn" src="./img/stop.png">
          </div>

          <div class="btn-div play-div" data-state="play">
            <!-- <img class="play-btn" src="./img/play.png"> -->
          </div>

          <div class="btn-div next-div">
            <img class="next-btn" src="./img/next-step.png">
          </div>
        </div>

      </div>

      <div class="step-list-menu">
        <div class="shadow-border-top"></div>
        <div class="shadow-border-bottom"></div>
        <div class="shadow-border-left"></div>
        <div class="shadow-border-right"></div>
        <div class="step-lists">
          <div class="step-mode step0 step1 step2 step3">
            <div class="step-title">
              <p>下面クロス</p>
            </div>
            <div class="step-in-step">
              <div class="step0"><p>1</p></div>
              <div class="step1"><p>2</p></div>
              <div class="step2"><p>3</p></div>
              <div class="step3"><p>4</p></div>
            </div>
            <div class="step-img-div">
              <img class="step-img" src="./img/step0.png">
            </div>
          </div>
          <div class="step-mode step4 step5 step6 step7">
            <div class="step-title">
              <p>下面コーナー</p>
            </div>
            <div class="step-in-step">
              <div class="step4"><p>1</p></div>
              <div class="step5"><p>2</p></div>
              <div class="step6"><p>3</p></div>
              <div class="step7"><p>4</p></div>
            </div>
            <div class="step-img-div">
              <img class="step-img" src="./img/step1.png">
            </div>
          </div>
          <div class="step-mode step8 step9 step10 step11">
            <div class="step-title">
              <p>中段エッジ</p>
            </div>
            <div class="step-in-step">
              <div class="step8"><p>1</p></div>
              <div class="step9"><p>2</p></div>
              <div class="step10"><p>3</p></div>
              <div class="step11"><p>4</p></div>
            </div>
            <div class="step-img-div">
              <img class="step-img" src="./img/step2.png">
            </div>
          </div>
          <div class="step-mode step12">
            <div class="step-title">
              <p>上面クロス</p>
            </div>
            <div class="step-img-div">
              <img class="step-img" src="./img/step3.png">
            </div>
          </div>
          <div class="step-mode step13">
            <div class="step-title">
              <p>上面コーナー</p>
            </div>
            <div class="step-img-div">
              <img class="step-img" src="./img/step4.png">
            </div>
          </div>
          <div class="step-mode step14">
            <div class="step-title">
              <p>上段クロス</p>
            </div>
            <div class="step-img-div">
              <img class="step-img" src="./img/step5.png">
            </div>
          </div>
          <div class="step-mode step15">
            <div class="step-title">
              <p>上段コーナー</p>
            </div>
            <div class="step-img-div">
              <img class="step-img" src="./img/step6.png">
            </div>
          </div>
        </div>
      </div>
    </div>

    <svg id="annotation-svg" class="ui-overlay first-loading-ui-overlay">
      <g id="first-icon" class="loading-icon" transform="translate(-200, 0)">
        <g class="icon-frames">
          <polygon points="3.67394039744206e-15 -60,51.96152422706631 -30,51.96152422706632 29.99999999999999,3.67394039744206e-15 60,-51.961524227066306 30.00000000000002,-51.96152422706631 -30.000000000000007"></polygon>
          <polygon points="0 0, 51.96152422706631 -30"></polygon>
          <polygon points="0 0, 3.67394039744206e-15 60"></polygon>
          <polygon points="0 0, -51.96152422706631 -30.000000000000007"></polygon>
        </g>
        <path d="M 3.67394039744206e-15 -60 L 51.96152422706631 -30 L 51.96152422706632 29.99999999999999 L 3.67394039744206e-15 60 L -51.961524227066306 30.00000000000002 L -51.96152422706631 -30.000000000000007 L 3.67394039744206e-15 -60 Z" style="fill: none; stroke: #3182ce; stroke-width: 4px; stroke-linecap: inherit; stroke-linejoin: bevel; stroke-dasharray: 60, 120; animation: run-line 2s linear infinite;"></path>
      </g>
    </svg>

    <script>
      (function() {
        const svg = document.getElementById('annotation-svg');
        const icon = document.getElementById('first-icon');

        // const totalLength = line.getTotalLength();
        const _svg = svg.getBoundingClientRect();
        // const _line = line.getBoundingClientRect();
        
        icon.setAttribute("transform",`translate(${_svg.width/2}, ${_svg.height/2})`);
      })();
    </script>
  </body >
</html>
